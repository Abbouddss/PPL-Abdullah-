<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abdullah – Fitness Command Center</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --bg-page:#EEF0F3;
  --bg-glass:rgba(255,255,255,0.6);
  --bg-card:rgba(255,255,255,0.55);
  --bg-sidebar:rgba(255,255,255,0.55);
  --border-glass:rgba(255,255,255,0.6);
  --border-card:rgba(255,255,255,0.5);
  --text-primary:#1C1C1E;
  --text-secondary:rgba(60,60,67,0.6);
  --text-label:rgba(60,60,67,0.45);
  --text-dark:#1C1C1E;
  --accent-low:#FF3B30;
  --accent-mid:#FF9500;
  --accent-hi:#34C759;
  --accent-blue:#007AFF;
  --sidebar-w:196px;
  --radius-lg:22px;
  --radius-md:18px;
  --radius-sm:12px;
  --shadow-card:0 10px 30px -10px rgba(60,60,67,0.16),0 2px 6px -1px rgba(60,60,67,0.06);
  --shadow-sm:0 10px 30px -10px rgba(60,60,67,0.12),0 2px 6px -1px rgba(60,60,67,0.05);
  --tr:0.25s cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  background:var(--bg-page);
  background-image:radial-gradient(ellipse 70% 50% at 15% -10%,rgba(120,140,170,.16) 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 90% 100%,rgba(140,150,165,.14) 0%,transparent 55%);
  min-height:100vh;color:var(--text-dark);overflow-x:hidden;
}
button{cursor:pointer;border:none;background:none;font-family:inherit}
button:active{transform:scale(0.98)}
input,textarea,select{font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;box-shadow:0 0 0 3px rgba(0,122,255,0.35)}

/* LAYOUT */
.app-shell{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar-w);background:var(--bg-sidebar);display:flex;flex-direction:column;align-items:stretch;
  padding:24px 14px;gap:3px;position:fixed;top:12px;left:12px;height:calc(100vh - 24px);z-index:100;
  border-radius:26px;border:1px solid var(--border-glass);
  box-shadow:0 20px 50px -12px rgba(60,60,67,.18);
  backdrop-filter:blur(25px) saturate(180%);-webkit-backdrop-filter:blur(25px) saturate(180%);
}
.sidebar-logo{font-size:17px;font-weight:800;color:var(--text-dark);letter-spacing:-.5px;margin-bottom:22px;text-align:left;line-height:1.1;padding-left:10px}
.sidebar-logo span{display:block;font-size:9px;font-weight:600;color:rgba(60,60,67,.45);letter-spacing:2px;text-transform:uppercase;margin-top:2px}
.nav-item{width:100%;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:flex-start;gap:11px;padding:0 12px;color:rgba(60,60,67,.6);font-size:17px;font-weight:600;transition:var(--tr);position:relative}
.nav-item .nav-label{font-size:13px;font-weight:600;letter-spacing:-0.01em}
.nav-item:hover{background:rgba(0,0,0,.045);color:var(--text-dark)}
.nav-item.active{background:#fff;color:var(--text-dark);box-shadow:0 4px 14px -2px rgba(60,60,67,.18)}
.nav-item:active{transform:scale(0.97)}
.nav-item .tip{display:none}
.main-content{margin-left:calc(var(--sidebar-w) + 24px);flex:1;padding:24px 28px;max-width:calc(100vw - var(--sidebar-w) - 24px)}

/* TOPBAR */
.topbar{display:flex;align-items:center;gap:16px;margin-bottom:28px}
.topbar-greeting{flex:1}
.topbar-greeting h1{font-size:24px;font-weight:700;color:var(--text-dark);letter-spacing:-0.02em}
.topbar-greeting p{font-size:13px;color:rgba(60,60,67,.6);margin-top:2px}
.search-wrap{position:relative;flex:0 0 320px}
.search-wrap input{
  width:100%;background:rgba(120,120,128,0.12);backdrop-filter:blur(25px) saturate(180%);-webkit-backdrop-filter:blur(25px) saturate(180%);
  border:1px solid rgba(255,255,255,0.18);border-radius:12px;padding:10px 16px 10px 40px;font-size:14px;color:var(--text-dark);
  outline:none;transition:var(--tr);box-shadow:var(--shadow-sm);
}
.search-wrap input::placeholder{color:rgba(60,60,67,.4)}
.search-wrap input:focus{border-color:rgba(0,122,255,.5);box-shadow:0 0 0 3px rgba(0,122,255,.25)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:rgba(60,60,67,.4);font-size:15px;pointer-events:none}
.search-results{position:absolute;top:calc(100% + 8px);left:0;right:0;background:rgba(255,255,255,.85);backdrop-filter:blur(25px) saturate(180%);-webkit-backdrop-filter:blur(25px) saturate(180%);border-radius:var(--radius-md);box-shadow:0 20px 50px rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.4);z-index:200;max-height:320px;overflow-y:auto;display:none}
.search-results.show{display:block}
.search-result-item{padding:10px 16px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .15s}
.search-result-item:hover{background:rgba(0,0,0,.04)}
.search-result-tag{background:rgba(0,122,255,.12);color:var(--accent-blue);font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700}
.date-badge{background:var(--bg-card);backdrop-filter:blur(25px) saturate(180%);-webkit-backdrop-filter:blur(25px) saturate(180%);color:var(--text-dark);border:1px solid var(--border-glass);border-radius:12px;padding:10px 16px;font-size:13px;font-weight:600;white-space:nowrap;box-shadow:var(--shadow-sm)}

/* PAGE */
.page{display:none}.page.active{display:block}
.section-title{font-size:18px;font-weight:700;color:var(--text-dark);letter-spacing:-0.02em;margin-bottom:16px}
.section-sub{font-size:13px;color:rgba(60,60,67,.6);font-weight:400;margin-left:8px}

/* GLASS */
.glass-card{
  background:var(--bg-glass);backdrop-filter:blur(25px) saturate(180%);-webkit-backdrop-filter:blur(25px) saturate(180%);
  border:1px solid rgba(255,255,255,0.18);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:20px;
}

/* DARK WIDGET */
.dark-widget{background:var(--bg-card);backdrop-filter:blur(25px) saturate(180%);-webkit-backdrop-filter:blur(25px) saturate(180%);border:1px solid var(--border-card);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:20px;color:var(--text-primary)}
.dark-widget .wlabel{font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-label);margin-bottom:8px}
.dark-widget .wvalue{font-size:32px;font-weight:700;letter-spacing:-0.02em;line-height:1}
.dark-widget .wsub{font-size:12px;color:var(--text-secondary);margin-top:4px}

/* PROGRESS BAR */
.pb-bg{height:6px;border-radius:99px;background:rgba(60,60,67,.12);overflow:hidden;margin-top:12px}
.pb-fill{height:100%;border-radius:99px;transition:width .6s cubic-bezier(.4,0,.2,1),background-position .6s;background:linear-gradient(90deg,var(--accent-low),var(--accent-mid) 50%,var(--accent-hi));background-size:200% 100%}

/* GRIDS */
.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.dash-grid-wide{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:20px}
.dash-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.mb-16{margin-bottom:16px}.mb-20{margin-bottom:20px}.mt-8{margin-top:8px}.mt-12{margin-top:12px}

/* VISUAL PROGRESS WIDGET */
.vp-widget{margin-bottom:20px}
.vp-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.vp-header h2{font-size:17px;font-weight:700;color:var(--text-dark);letter-spacing:-0.02em;flex:1}
.vp-badge{background:rgba(0,122,255,.12);color:var(--accent-blue);font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;letter-spacing:.2px}
.vp-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.vp-frame{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:3/4;box-shadow:0 10px 30px -10px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.15);background:#000}
.vp-frame img{width:100%;height:100%;object-fit:cover;display:block}
.vp-tag{
  position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  color:#fff;font-size:11px;font-weight:700;letter-spacing:.3px;padding:5px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.15);
}

/* WORKOUT SECTION */
.day-selector-bar{
  display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:20px;
  scrollbar-width:none;
}
.day-selector-bar::-webkit-scrollbar{display:none}
.day-pill{
  flex-shrink:0;padding:12px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.18);
  background:rgba(120,120,128,0.12);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  cursor:pointer;transition:var(--tr);text-align:center;min-width:96px;
  box-shadow:var(--shadow-sm);
}
.day-pill:hover:not(.rest-pill){border-color:rgba(0,122,255,.35);background:rgba(0,122,255,.08)}
.day-pill:active:not(.rest-pill){transform:scale(0.98)}
.day-pill.active{background:var(--accent-blue);border-color:var(--accent-blue);color:#fff;box-shadow:0 8px 20px -6px rgba(0,122,255,.55)}
.day-pill.rest-pill{opacity:.5;cursor:default}
.day-pill.completed-pill .pill-status::after{content:'✅';margin-left:4px}
.pill-day{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;opacity:.55;font-weight:700}
.pill-name{font-size:14px;font-weight:700;margin:3px 0}
.pill-status{font-size:11px;opacity:.6;font-weight:600}

.workout-header-card{
  background:var(--bg-card);backdrop-filter:blur(25px) saturate(180%);-webkit-backdrop-filter:blur(25px) saturate(180%);border-radius:var(--radius-lg);padding:22px 24px;
  margin-bottom:18px;color:var(--text-dark);box-shadow:var(--shadow-sm);border:1px solid var(--border-card);
}
.wh-top{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.wh-title{flex:1}
.wh-title h2{font-size:24px;font-weight:700;letter-spacing:-0.02em;color:var(--text-dark)}
.wh-title p{font-size:13px;color:var(--text-secondary);margin-top:4px}
.wh-date{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.wh-date label{font-size:12px;font-weight:600;color:rgba(60,60,67,.6);white-space:nowrap}
.wh-date input[type=date]{
  background:rgba(60,60,67,.06);border:1px solid rgba(60,60,67,.14);
  border-radius:10px;padding:8px 14px;font-size:13px;color:var(--text-dark);outline:none;
  cursor:pointer;color-scheme:light;transition:border-color .2s;
}
.wh-date input[type=date]:focus{border-color:rgba(0,122,255,.7);box-shadow:0 0 0 3px rgba(0,122,255,.35)}
.btn-apply{
  background:var(--accent-blue);color:#fff;border-radius:10px;
  padding:8px 18px;font-size:13px;font-weight:700;transition:var(--tr);
  border:1px solid rgba(255,255,255,.15);
}
.btn-apply:hover{background:#0064d6}
.btn-apply:active{transform:scale(0.98)}
.date-applied-label{font-size:13px;color:var(--accent-hi);font-weight:700}

.workout-panel{display:none}.workout-panel.active{display:block}

/* BUTTONS */
.btn-primary{background:var(--accent-blue);color:#fff;border-radius:12px;padding:10px 20px;font-size:14px;font-weight:600;transition:var(--tr);display:inline-flex;align-items:center;gap:6px}
.btn-primary:hover{background:#0064d6;transform:translateY(-1px)}
.btn-primary:active{transform:scale(0.98)}

/* TOAST */
.toast-container{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:rgba(28,30,35,.85);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);color:#fff;padding:12px 18px;border-radius:14px;font-size:13px;font-weight:500;box-shadow:var(--shadow-card);animation:toastIn .3s ease;min-width:220px;display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.1)}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* RESPONSIVE */
@media(max-width:600px){
  :root{--sidebar-w:0px}
  .sidebar{
    width:100% !important;height:64px !important;top:auto !important;left:0 !important;right:0 !important;bottom:0 !important;
    border-radius:0 !important;flex-direction:row !important;align-items:center !important;justify-content:space-around !important;
    padding:0 4px !important;gap:0 !important;border-right:none !important;border-top:1px solid var(--border-glass) !important;
    background:rgba(255,255,255,0.75) !important;backdrop-filter:blur(25px) saturate(180%) !important;-webkit-backdrop-filter:blur(25px) saturate(180%) !important;
    overflow:hidden !important;box-shadow:0 -8px 30px -12px rgba(60,60,67,.18) !important;
  }
  .sidebar-logo{ display:none !important }
  .nav-item{ width:44px !important;height:44px !important;border-radius:12px !important;font-size:18px !important;flex-shrink:0 !important;flex-direction:column !important;justify-content:center !important;padding:0 !important }
  .nav-item.active{ background:transparent !important; color:var(--accent-blue) !important; box-shadow:none !important }
  .nav-item .nav-label{ display:none !important }
  .main-content{ margin-left:0 !important;max-width:100vw !important;padding:16px 14px 80px !important }
  .dash-grid{ grid-template-columns:1fr 1fr }
}
</style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<div class="app-shell">
<aside class="sidebar">
  <div class="sidebar-logo">A-FIT<span>FIT</span></div>
  <button class="nav-item active" data-page="dashboard" onclick="navTo('dashboard',this)">🏠<span class="nav-label">Home</span></button>
  <button class="nav-item" data-page="workout" onclick="navTo('workout',this)">💪<span class="nav-label">Workouts</span></button>
</aside>

<main class="main-content">
  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-greeting">
      <h1 id="greetingText">Good morning, Abdullah 👋</h1>
      <p id="greetingSub">Let's crush today's session.</p>
    </div>
    <div class="date-badge" id="topbarDate"></div>
  </div>

  <!-- DASHBOARD -->
  <div class="page active" id="page-dashboard">
    <div class="glass-card vp-widget">
      <div class="vp-header">
        <h2>Visual Progress</h2>
        <span class="vp-badge">July 2026</span>
      </div>
      <div class="vp-grid">
        <div class="vp-frame">
          <img src="./progress-front.jpg" alt="Front Progress">
          <span class="vp-tag">Front</span>
        </div>
        <div class="vp-frame">
          <img src="./progress-back.jpg" alt="Back Progress">
          <span class="vp-tag">Back</span>
        </div>
      </div>
    </div>
  </div>

  <!-- WORKOUT -->
  <div class="page" id="page-workout">
    <div class="section-title">Workouts</div>
    <div class="day-selector-bar" id="daySelectorBar"></div>
    <div id="workoutPanels"></div>
  </div>
</main>
</div>

<script>
const DAYS_SHORT=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const ROTATION_EPOCH = new Date(2025, 0, 5);
const ROTATION_NAMES = ['Push', 'Pull', 'Legs', 'Rest'];

function localDateStr(d){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}

function parseDateLocalSafe(s) {
  if (!s) return new Date();
  const parts = s.split('-').map(Number);
  return new Date(parts[0], parts[1] - 1, parts[2]);
}

function getRotationIndex(dateStr) {
  const d = parseDateLocalSafe(dateStr);
  const msPerDay = 24 * 60 * 60 * 1000;
  const daysDiff = Math.floor((d - ROTATION_EPOCH) / msPerDay);
  return ((daysDiff % 4) + 4) % 4;
}

function getPlanForDate(dateStr) {
  const idx = getRotationIndex(dateStr);
  const name = ROTATION_NAMES[idx];
  return { name, type: name === 'Rest' ? 'rest' : 'workout', rotIdx: idx };
}

function navTo(pageId, btn){
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  if(btn) btn.classList.add('active');
  document.getElementById('page-'+pageId).classList.add('active');
}

function showToast(msg){
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

function buildWorkoutSectionForDate(anchorDateStr){
  const bar=document.getElementById('daySelectorBar');
  const panels=document.getElementById('workoutPanels');
  bar.innerHTML=''; panels.innerHTML='';
  const anchor=parseDateLocalSafe(anchorDateStr);
  
  for(let i=0; i<7; i++){
    const d = new Date(anchor);
    d.setDate(anchor.getDate() + i);
    const ds = localDateStr(d);
    const plan = getPlanForDate(ds);
    
    const pill = document.createElement('button');
    pill.className = 'day-pill' + (plan.type === 'rest' ? ' rest-pill' : '');
    pill.innerHTML = `
      <div class="pill-day">${DAYS_SHORT[d.getDay()]}</div>
      <div class="pill-name">${plan.name}</div>
    `;
    bar.appendChild(pill);
  }
}

document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('topbarDate').textContent = new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  buildWorkoutSectionForDate(localDateStr(new Date()));
});
</script>
</body>
</html>
